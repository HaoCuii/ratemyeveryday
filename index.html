<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ratemyeveryday</title>
  <meta name="description" content="Rate every day from 1 to 10 and watch your year turn into a heatmap.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
</head>
<body class="min-h-screen">
  <!-- oil-paint backdrop -->
  <canvas id="mosaic" class="pointer-events-none fixed inset-0 z-0 h-screen w-screen object-cover object-left-bottom" aria-hidden="true"></canvas>
  <div class="pointer-events-none fixed inset-0 z-0 bg-veil" aria-hidden="true"></div>

  <div class="relative z-1 px-4 pt-[clamp(16px,5vw,56px)] pb-16">
    <main class="mx-auto flex max-w-[1080px] min-w-0 flex-col gap-7 border border-glass-line bg-glass p-[clamp(18px,3vw,36px)] shadow-soft backdrop-blur-[26px] backdrop-saturate-140">

      <header class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 font-medium tracking-tight">
          <canvas id="brandMark" class="size-[26px]" aria-hidden="true"></canvas>ratemyeveryday
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <div class="inline-flex bg-empty p-0.5" role="group" aria-label="Grid layout">
            <button type="button" data-lay="weeks" class="px-2.5 py-1 text-[13px] text-muted aria-pressed:bg-surface aria-pressed:text-fg aria-pressed:shadow-sm">Weeks</button>
            <button type="button" data-lay="months" class="px-2.5 py-1 text-[13px] text-muted aria-pressed:bg-surface aria-pressed:text-fg aria-pressed:shadow-sm">Months</button>
            <button type="button" data-lay="custom" class="px-2.5 py-1 text-[13px] text-muted aria-pressed:bg-surface aria-pressed:text-fg aria-pressed:shadow-sm">Custom</button>
          </div>
          <label id="customWrap" class="inline-flex items-center gap-1.5 text-[13px] text-muted" hidden>
            days per column
            <input id="customN" type="number" min="3" max="60" value="19" class="w-13 border border-line bg-surface px-1.5 py-1 text-center font-mono text-[13px]">
          </label>
          <button id="signInTop" type="button" class="text-[13px] text-muted underline decoration-line underline-offset-3 hover:text-fg" hidden>Sign in</button>
          <span id="acct" class="inline-flex items-center gap-2 text-[12.5px] text-muted" hidden>
            <img id="acctImg" alt="" class="size-[22px]" referrerpolicy="no-referrer">
            <span id="acctHandle"></span>
            <button id="signOut" type="button" class="underline decoration-line underline-offset-3 hover:text-fg">Sign out</button>
          </span>
        </div>
      </header>

      <div class="flex flex-wrap items-end justify-between gap-4">
        <h1 id="title" class="m-0 text-[clamp(34px,6vw,56px)] leading-none font-light tracking-[-.035em] text-balance [&_b]:font-medium">Your <b>2026</b></h1>
        <div class="inline-flex items-center gap-1">
          <button id="shareBtn" type="button" class="mr-2 inline-flex h-[30px] items-center gap-1.5 border border-line bg-surface px-3 text-[13px] text-muted hover:text-fg">
            <svg viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 10V2M5 5l3-3 3 3M3 9v5h10V9"/></svg>
            Share
          </button>
          <button id="prevYear" type="button" aria-label="Previous year" class="grid size-[30px] place-items-center border border-line bg-surface text-muted hover:text-fg disabled:cursor-default disabled:opacity-35">‹</button>
          <span id="yearLabel" class="min-w-11 text-center font-mono text-[13px]">2026</span>
          <button id="nextYear" type="button" aria-label="Next year" class="grid size-[30px] place-items-center border border-line bg-surface text-muted hover:text-fg disabled:cursor-default disabled:opacity-35">›</button>
        </div>
      </div>

      <div id="people" class="flex flex-wrap items-center gap-2" hidden></div>
      <div id="notice" class="border border-dashed border-line px-3.5 py-2.5 text-[13px] text-muted" hidden></div>

      <section aria-label="Year heatmap" class="min-w-0">
        <div id="boardWrap" class="-mx-1 min-w-0 overflow-x-auto px-1 pb-1">
          <div id="board" class="grid w-max grid-cols-[auto_auto] gap-x-2 gap-y-1.5">
            <div></div>
            <div id="topLab" class="grid-cols-board grid gap-(--gap)"></div>
            <div id="leftLab" class="grid-rows-board grid gap-(--gap)"></div>
            <div id="cells" class="cells grid-cols-board grid-rows-board grid gap-(--gap)"></div>
          </div>
        </div>
      </section>

      <div class="flex flex-wrap items-center gap-6">
        <div id="stats" class="flex flex-wrap gap-6 font-mono text-[11px] text-faint tabular-nums"></div>
        <label class="inline-flex cursor-pointer items-center gap-1.5 font-mono text-[11px] text-faint select-none hover:text-fg">
          <input type="checkbox" id="numToggle" class="tick" checked> numbers
        </label>
      </div>
    </main>
    <footer class="mx-auto mt-2 flex max-w-[1080px] justify-end">
      <a href="/privacy.html" class="font-mono text-[9px] text-fg opacity-15 transition-opacity hover:opacity-60">privacy</a>
    </footer>
  </div>

  <!-- overlays -->
  <div id="tip" role="tooltip" class="pointer-events-none fixed z-50 max-w-60 translate-y-[3px] bg-fg px-[11px] py-[9px] text-[12.5px] text-bg opacity-0 shadow-soft transition [&.on]:translate-y-0 [&.on]:opacity-100"></div>
  <div id="scrim" class="fixed inset-0 z-55 [&.dim]:bg-black/25" hidden></div>

  <div id="editor" role="dialog" aria-labelledby="edTitle" class="sheet fixed z-60 flex w-80 max-w-[calc(100vw-32px)] flex-col gap-3 border border-line bg-surface p-4 shadow-soft" hidden>
    <div>
      <h3 id="edTitle" class="text-[15px] font-medium tracking-tight">Day</h3>
      <div id="edSub" class="font-mono text-xs text-muted"></div>
    </div>
    <div id="edScale" class="grid grid-cols-5 gap-1.5"></div>
    <button id="edLockOpen" type="button" class="self-start text-[13px] text-muted underline decoration-line underline-offset-3 hover:text-fg" hidden>Add a private note</button>
    <div id="edLock" class="flex flex-col gap-2 border border-dashed border-line p-3" hidden>
      <p id="edLockMsg" class="text-[12.5px] leading-snug text-muted"></p>
      <input type="password" id="edPass1" autocomplete="new-password" placeholder="Notes passphrase" class="w-full border border-line bg-bg px-2.5 py-2 text-[13.5px]">
      <input type="password" id="edPass2" autocomplete="new-password" placeholder="Type it again" class="w-full border border-line bg-bg px-2.5 py-2 text-[13.5px]">
      <div class="flex items-center justify-between gap-2">
        <span id="edLockErr" class="text-[12px] text-[oklch(.6_.18_25)]"></span>
        <button id="edLockBtn" type="button" class="shrink-0 border border-fg bg-fg px-3 py-1.5 text-[13px] text-bg disabled:opacity-40">Set passphrase</button>
      </div>
    </div>
    <textarea id="edNote" maxlength="140" placeholder="A small note (only shows on hover)" class="min-h-[72px] w-full resize-y border border-line bg-bg px-2.5 py-2 text-[13.5px] leading-snug"></textarea>
    <div class="flex items-center justify-between gap-2">
      <span id="edCount" class="font-mono text-[11px] text-faint">0/140</span>
      <div class="flex gap-1.5">
        <button id="edClear" type="button" class="border border-line bg-surface px-3.5 py-1.5 text-[13px]">Clear</button>
        <button id="edSave" type="button" class="border border-fg bg-fg px-3.5 py-1.5 text-[13px] text-bg disabled:cursor-default disabled:opacity-40">Save</button>
      </div>
    </div>
  </div>

  <div id="friendPop" role="dialog" aria-label="Friends" class="sheet fixed z-60 flex w-80 max-w-[calc(100vw-32px)] flex-col gap-3 border border-line bg-surface p-4 shadow-soft" hidden>
    <h3 class="text-[15px] font-medium tracking-tight">Friends</h3>
    <input type="search" id="friendSearch" placeholder="Their exact @handle" autocomplete="off" class="w-full border border-line bg-bg px-2.5 py-2 text-[13.5px]">
    <div id="friendList" class="-mx-1.5 flex max-h-[300px] flex-col gap-0.5 overflow-auto"></div>
    <div id="myHandleLine" class="font-mono text-xs text-muted"></div>
  </div>

  <div id="sharePop" role="dialog" aria-labelledby="shTitle" class="sheet fixed inset-0 m-auto h-fit z-60 flex w-[min(720px,calc(100vw-32px))] flex-col gap-4 border border-line bg-surface p-5 shadow-soft" hidden>
    <div class="flex items-center justify-between gap-3">
      <h3 id="shTitle" class="text-[15px] font-medium tracking-tight">Share your year</h3>
      <button id="shClose" type="button" aria-label="Close" class="text-muted hover:text-fg">✕</button>
    </div>
    <div class="max-h-[50vh] overflow-auto border border-line bg-white p-2">
      <img id="shPreview" alt="Preview of the heatmap image" class="mx-auto block h-auto max-w-full">
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-4">
        <label class="inline-flex cursor-pointer items-center gap-1.5 font-mono text-[12px] text-muted select-none hover:text-fg">
          <input type="checkbox" id="shNums" class="tick"> numbers
        </label>
        <div class="inline-flex bg-empty p-0.5" role="group" aria-label="File type">
          <button type="button" data-fmt="png" class="px-2.5 py-1 font-mono text-[12px] text-muted aria-pressed:bg-surface aria-pressed:text-fg aria-pressed:shadow-sm">PNG</button>
          <button type="button" data-fmt="pdf" class="px-2.5 py-1 font-mono text-[12px] text-muted aria-pressed:bg-surface aria-pressed:text-fg aria-pressed:shadow-sm">PDF</button>
        </div>
      </div>
      <div class="flex gap-1.5">
        <button id="shShare" type="button" class="border border-line bg-surface px-3.5 py-1.5 text-[13px]" hidden>Share…</button>
        <button id="shDownload" type="button" class="border border-fg bg-fg px-3.5 py-1.5 text-[13px] text-bg disabled:opacity-40">Download</button>
      </div>
    </div>
    <div id="shErr" class="text-[12.5px] text-muted" hidden></div>
  </div>

  <div id="signPop" role="dialog" aria-labelledby="spTitle" class="fullsheet fixed inset-0 m-auto h-fit z-60 flex w-[min(380px,calc(100vw-32px))] flex-col gap-3 border border-line bg-surface p-5 shadow-soft" hidden>
    <h3 id="spTitle" class="text-[15px] font-medium tracking-tight">Sign in to add friends</h3>
    <div id="spErr" class="text-[12.5px] text-muted" hidden></div>
    <div class="sheet-actions flex flex-wrap items-center justify-between gap-2 pt-1">
      <button id="spLater" type="button" class="text-[13px] text-muted underline decoration-line underline-offset-3 hover:text-fg">Not now</button>
      <div id="gbtn" class="min-h-10"></div>
      <button id="google" hidden type="button" class="inline-flex items-center gap-2.5 border border-fg bg-fg px-4 py-2 font-medium text-bg">
        <svg viewBox="0 0 48 48" class="box-content size-4 bg-white p-0.5" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        Continue with Google
      </button>
    </div>
  </div>

  <div id="onboard" role="dialog" aria-labelledby="obTitle" class="fullsheet fixed inset-0 m-auto h-fit z-60 flex w-80 max-w-[calc(100vw-32px)] flex-col gap-3 border border-line bg-surface p-4 shadow-soft" hidden>
    <h3 id="obTitle" class="text-[15px] font-medium tracking-tight">Pick your handle</h3>
    <p class="text-[13px] text-muted">Friends find you by this. Lowercase letters, numbers and underscores, 3 to 20 characters.</p>
    <div class="flex items-center border border-line bg-bg">
      <span class="pl-2.5 font-mono text-muted">@</span>
      <input type="text" id="obHandle" maxlength="20" autocomplete="off" spellcheck="false" class="w-full bg-transparent px-1 py-2 font-mono text-[13.5px] outline-none">
    </div>
    <div id="obErr" class="text-[12.5px] text-[oklch(.6_.18_25)]" hidden></div>
    <div class="sheet-actions flex justify-end">
      <button id="obSave" type="button" class="border border-fg bg-fg px-3.5 py-1.5 text-[13px] text-bg disabled:opacity-40">Start my year</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
